# ============================================================================
# بيتك ديزاين — بوابة التحقق المستقلة
#
# قرار الطاقم: ستاك Supabase محلي كامل داخل الـrunner — لا PostgreSQL عارٍ —
# لأن مجموعات HTTP/JWT وRLS تمرّ عبر Kong وPostgREST وAuth لا القاعدة وحدها.
#
# لا يتصل هذا الـworkflow بأي سيرفر حي ولا يستعمل أي سرّ إنتاجي:
# `supabase start` يقلع ستاكًا مؤقتًا بمفاتيح تطوير معروفة، و`db reset` يثبت
# أن أي مستنسخ للمستودع يعيد بناء القاعدة من الترحيلات وحدها.
#
# النطاق عمدًا «بوابة تحقق» فقط — لا نشر ولا staging (قرار الطاقم: لا تحويل
# CI إلى مشروع طويل الآن).
# ============================================================================
name: verification-gate

# منع ازدواج push/pull_request (قرار الطاقم بعد أول اخضرار):
# فروع الميزات تُفحص عبر pull_request فقط؛ push يبقى على main (تحقق ما بعد
# الدمج) وعلى ci/** حصرًا — كي تظل تعديلات البوابة نفسها ذاتية التحقق قبل الدمج.
#
# دين تقني مسجَّل: supabase/setup-cli ما زال node20 من جهته (تحذير أول تشغيل)
# — يُرفع التثبيت فور صدور إصدار node24 منه. ليس مانع دمج بقرار المراجعة.
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read   # البوابة تقرأ فقط — لا كتابة للمستودع ولا حاجة لأكثر

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash   # يمنح pipefail — وإلا ابتلع tee أكواد فشل المجموعات

jobs:
  database:
    name: database suites (full local Supabase)
    runs-on: ubuntu-24.04   # اسم صريح — لا انتقال Major تلقائي مع -latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (node24)

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1  # v1
        with:
          version: 2.111.0   # مثبَّت عمدًا — يُرفع بالتزام مقصود لا بانجراف latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Rebuild database from migrations (from scratch)
        run: supabase db reset

      - name: Prepare test environment
        run: |
          mkdir -p "$RUNNER_TEMP/shim" logs
          cp supabase/tests/ci/vps.py "$RUNNER_TEMP/shim/vps.py"

          DBC=$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -1)
          test -n "$DBC"
          echo "database container: $DBC"
          {
            echo "VPS_HELPER_DIR=$RUNNER_TEMP/shim"
            echo "BAYTAK_DB_CONTAINER=$DBC"
            echo "BAYTAK_INSTANCE_ID=local"
          } >> "$GITHUB_ENV"

          # مفاتيح الستاك المحلي (مفاتيح تطوير عامة، لا أسرار) لاختبار HTTP/JWT
          supabase status -o env > /tmp/status.env
          . /tmp/status.env
          {
            echo "SUPABASE_URL=${API_URL}"
            echo "SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_JWT_SECRET=${JWT_SECRET}"
          } > .env
          echo "api url: ${API_URL}"

      - name: RLS and write-surface suite
        run: python3 supabase/tests/run_rls.py 2>&1 | tee logs/rls.log

      - name: reserve_fabric suite
        run: python3 supabase/tests/reserve_fabric.py 2>&1 | tee logs/reserve.log

      - name: consume/release/return/damage suite
        run: python3 supabase/tests/consume_and_release.py 2>&1 | tee logs/consume.log

      - name: quotation contracts suite
        run: python3 supabase/tests/quotation_contracts.py 2>&1 | tee logs/quotation.log

      - name: quotation lifecycle RPCs suite
        run: python3 supabase/tests/quotation_rpcs.py 2>&1 | tee logs/quotation_rpcs.log

      - name: golden pricing vectors (SQL side)
        run: python3 supabase/tests/golden_pricing_vectors.py 2>&1 | tee logs/golden_vectors.log

      - name: discount RPCs suite
        run: python3 supabase/tests/discount_rpcs.py 2>&1 | tee logs/discount.log

      - name: HTTP JWT identity suite (Kong -> PostgREST -> RLS)
        run: python3 supabase/tests/http_jwt_identity.py 2>&1 | tee logs/http.log

      - name: Declarative schema drift check
        run: python3 supabase/tests/schema_drift.py 2>&1 | tee logs/drift.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (node24)
        with:
          name: test-logs
          path: logs/

  typescript:
    name: expo type-check
    runs-on: ubuntu-24.04   # اسم صريح — لا انتقال Major تلقائي مع -latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (node24)

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.14   # نفس إصدار جهاز التطوير

      - name: Install dependencies (frozen lockfile)
        working-directory: expo
        run: bun install --frozen-lockfile

      - name: tsc --noEmit
        working-directory: expo
        run: bun x tsc --noEmit -p tsconfig.json   # عبر Bun المثبَّت — لا Node runner غير مثبَّت

      - name: golden pricing vectors (TS side)
        working-directory: expo
        run: bun test   # نفس متجهات SQL — أي فرق أغورة واحد يفشل البوابة
