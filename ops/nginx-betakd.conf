# ════════════════════════════════════════════════════════════════════
# betakd.com - نسخة الويب المكتبية (SPA)
#
# يوضع في: /etc/nginx/sites-available/betakd.conf
# ثم:      ln -s /etc/nginx/sites-available/betakd.conf /etc/nginx/sites-enabled/
#
# ملاحظة: هذا الملف يخدم **التطبيق فقط**. Supabase له كتلة server خاصّته
# على مضيفه، ولا يُمسّ. وCORS مضبوطٌ أصلًا على Kong (يردّ *) فلا شيء يلزم.
# ════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name betakd.com www.betakd.com;

    # يبقى مفتوحًا لتجديد الشهادة تلقائيًّا
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name betakd.com www.betakd.com;

    ssl_certificate     /etc/letsencrypt/live/betakd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/betakd.com/privkey.pem;

    # الرابط الرمزيّ - يتبدّل ذرّيًّا مع كل نشر، والتراجع بإعادة توجيهه
    root /var/www/betak-web/current;
    index index.html;

    charset utf-8;

    # نظامٌ داخليّ لا يُفهرَس
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # أصولٌ مبصومةٌ بالمحتوى: اسم الملفّ يتغيّر مع محتواه، فالتخزين الأبديّ آمن
    location /_expo/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ★ index لا يُخزَّن أبدًا. لولا هذا لبقي المتصفّح على النسخة القديمة
    #   بعد كل نشر، ولظنّ الموظّف أن التحديث لم يصل.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # SPA: أيّ مسارٍ لا ملفَّ له يعود إلى index ليتولّاه expo-router.
    # بدونه يُعطي /project/123 خطأ 404 عند إعادة تحميل الصفحة.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
