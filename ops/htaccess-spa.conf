# ════════════════════════════════════════════════════════════════════
# betakd.com - ارتداد SPA وتخزينُه، لخادم Apache (أو nginx أمام Apache).
#
# يُرفع باسم **`.htaccess`** (بنقطةٍ في أوّله) داخل نفس مجلّد `index.html`.
# في cPanel File Manager فعّل Settings ← Show Hidden Files لتراه.
#
# لِمَ هذا الملفّ: بلا ارتدادٍ يعطي `/project/123` خطأ 404 عند إعادة تحميل
# الصفحة أو فتح رابطٍ محفوظ - يعمل التنقّل داخل التطبيق ثم ينكسر أوّل تحديث.
# ════════════════════════════════════════════════════════════════════

AddDefaultCharset UTF-8

<IfModule mod_rewrite.c>
  RewriteEngine On
  RewriteBase /

  # ملفٌّ موجودٌ أو مجلّد يُخدَم كما هو (الحزمة، الخطوط، الأيقونة)
  RewriteCond %{REQUEST_FILENAME} -f [OR]
  RewriteCond %{REQUEST_FILENAME} -d
  RewriteRule ^ - [L]

  # وما عداه يعود إلى index ليتولّاه expo-router في المتصفّح
  RewriteRule ^ index.html [L]
</IfModule>

<IfModule mod_headers.c>
  # ★ index لا يُخزَّن أبدًا. لولا هذا لبقي المتصفّح على النسخة القديمة بعد
  #   كل نشر، ولظنّ الموظّف أن التحديث لم يصل.
  <FilesMatch "^index\.html$">
    Header set Cache-Control "no-store, must-revalidate"
  </FilesMatch>

  # الأصول مبصومةٌ بالمحتوى: اسم الملفّ يتغيّر مع محتواه، فالتخزين الأبديّ آمن
  <FilesMatch "\.(js|css|woff2|woff|ttf|otf|png|jpg|svg|ico)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
  </FilesMatch>

  # نظامٌ داخليّ لا يُفهرَس
  Header set X-Robots-Tag "noindex, nofollow"
  Header set X-Content-Type-Options "nosniff"
  Header set Referrer-Policy "same-origin"
</IfModule>

<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
</IfModule>
